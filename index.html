<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App..</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>


<body>
    <div class="box">
        <div class="topFixed">
            <h1>Todo List</h1>
            <div class="inp input-group input-group-sm mt-3">
                <input type="text" placeholder="enter your task" class="form-control">
                <button class="mainBtn btn btn-success">Add Task</button>
            </div>

        </div>
        <ul>
            <li>Eat <button class="del btn btn-outline-danger btn-sm">Delete</button></li>
            <li>Sleep <button class="del btn btn-outline-danger btn-sm">Delete</button></li>
        </ul>
    </div>



    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
